models:
    deepseek-v4-flash:
        config:
            anthropic_endpoint: https://api.deepseek.com/anthropic
            api_endpoint: https://api.deepseek.com
            api_key_env: DEEPSEEK_API_KEY
            model: deepseek-v4-flash
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: deepseek
    gpt-5.5:
        config:
            anthropic_endpoint: ""
            api_endpoint: https://api.onefaka.com/v1
            api_key_env: CHAT_GPT_API_KEY
            model: gpt-5.5
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: openai
    mimo-v2.5-pro:
        config:
            anthropic_endpoint: https://token-plan-cn.xiaomimimo.com/anthropic
            api_endpoint: https://token-plan-cn.xiaomimimo.com/v1
            api_key_env: MIMO_V2.5_PRO_API_KEY
            model: mimo-v2.5-pro
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: mimo
    minimax-m2.7:
        config:
            anthropic_endpoint: https://api.minimaxi.com/anthropic
            api_endpoint: https://api.minimax.chat/v1
            api_key_env: MINIMAX_API_KEY
            model: MiniMax-M2.7
            parameters:
                max_tokens: 4096
                temperature: 0.7
                top_p: 0.9
        enabled: true
        provider: minimax
