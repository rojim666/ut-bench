<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTBench · 单元测试基准</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body class="h-screen flex overflow-hidden" x-data="app()" x-cloak>

  <!-- Sidebar -->
  <aside class="app-sidebar w-60 flex-shrink-0 flex flex-col">
    <div class="app-brand px-4 py-4 flex items-center gap-3 border-b">
      <div class="brand-mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
          <path class="brand-mark-box" d="M7.25 4.75h8.2M5.75 7.4v10.85h11.1v-5.7" />
          <path class="brand-mark-check" d="M9.2 12.15l2.55 2.55 6.85-7.35" />
          <path class="brand-mark-signal" d="M5.75 4.75h-1.3a1.7 1.7 0 0 0-1.7 1.7v12.1a1.7 1.7 0 0 0 1.7 1.7h12.1a1.7 1.7 0 0 0 1.7-1.7v-1.2" />
        </svg>
      </div>
      <div>
        <div class="font-semibold text-[15px] tracking-tight" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">UTBench</div>
        <div class="text-[11px]" style="color:var(--fg-muted)">单元测试基准平台</div>
      </div>
    </div>
    <nav class="app-nav flex-1 py-2 px-2">
      <template x-for="item in nav" :key="item.id">
        <div @click="goto(item.id)" :class="page === item.id ? 'active' : ''" class="nav-item">
          <span x-html="item.icon"></span>
          <span x-text="item.label"></span>
        </div>
      </template>
    </nav>
    <div class="app-sidebar-footer px-4 py-3 border-t">
      <!-- Environment status -->
      <template x-if="env">
        <div class="flex flex-wrap gap-1.5 mb-2">
          <span class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded" :style="`background:${env.docker_available ? 'rgba(7,193,96,.08)' : 'rgba(227,77,89,.08)'};color:${env.docker_available ? 'var(--green)' : 'var(--red)'}`">
            <span class="w-1 h-1 rounded-full" :style="`background:${env.docker_available ? 'var(--green)' : 'var(--red)'}`"></span>
            <span x-text="env.docker_available ? 'Docker' : '无Docker'"></span>
          </span>
          <span class="inline-flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded" :style="envImageStatusStyle(env.eval_image_present)">
            <span x-text="env.eval_image_present ? '镜像就绪' : '无镜像'"></span>
          </span>
          <button x-show="env.docker_available && !env.eval_image_present" @click="openBuildImage('eval', false)" class="text-[10px] px-1.5 py-0.5 rounded" style="color:var(--accent);background:var(--accent-bg)">构建</button>
          <button @click="recheckEnv()" :disabled="envChecking" class="text-[10px] px-1.5 py-0.5 rounded" style="color:var(--fg-muted)" title="重新检测">
            <svg :class="envChecking ? 'animate-spin' : ''" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-6.219-8.56"/><path d="M21 3v6h-6"/></svg>
          </button>
        </div>
      </template>
      <!-- Env recommendation -->
      <template x-if="env && env.recommendation">
        <div class="text-[10px] mb-2 leading-tight" style="color:var(--yellow)" x-text="env.recommendation"></div>
      </template>
      <div class="truncate text-[11px]" style="color:var(--fg-muted)">配置: <span x-text="config?.config_path ?? '...'" class="font-mono" style="color:var(--fg-subtle)"></span></div>
    </div>
  </aside>
  <!-- Main -->
  <main class="flex-1 flex flex-col overflow-hidden" style="background-color:var(--bg)">

    <!-- Header -->
    <header class="app-header h-14 border-b flex items-center px-6 flex-shrink-0">
      <h1 class="text-[16px] font-semibold" style="color:var(--fg)" x-text="pageTitle"></h1>
      <div class="ml-auto flex items-center gap-2">
        <button @click="loadRuns()" class="btn-ghost text-[12px]">刷新</button>
        <div class="w-px h-4" style="background:var(--border)"></div>
        <button @click="toggleTheme()" class="btn-ghost text-[12px] p-1.5" :title="theme==='dark'?'切换日间模式':'切换夜间模式'">
          <svg x-show="theme === 'dark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg x-show="theme === 'light'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <!-- Toast notification -->
    <template x-if="toast">
      <div class="px-6 py-2 text-[12px] border-b flex items-center gap-2" :style="toastStyle">
        <span x-text="toast"></span>
      </div>
    </template>

    <!-- Content -->
    <div class="app-content flex-1 overflow-y-auto p-6">
      <div id="partial-dashboard" data-partial="dashboard" x-ignore></div>
      <div id="partial-new-run" data-partial="new-run" x-ignore></div>
      <div id="partial-runs" data-partial="runs" x-ignore></div>
      <div id="partial-generated-sets" data-partial="generated-sets" x-ignore></div>
      <div id="partial-agents" data-partial="agents" x-ignore></div>
      <div id="partial-automations" data-partial="automations" x-ignore></div>
      <div id="partial-database" data-partial="database" x-ignore></div>
      <div id="partial-environment" data-partial="environment" x-ignore></div>
      <div id="partial-models" data-partial="models" x-ignore></div>
      <div id="partial-run-detail" data-partial="run-detail" x-ignore></div>
      <div id="partial-environment-install-modal" data-partial="environment-install-modal" x-ignore></div>
    </div>
  </main>
  <div id="partial-model-form-modal" data-partial="model-form-modal" x-ignore></div>
  <div id="partial-agent-form-modal" data-partial="agent-form-modal" x-ignore></div>
  <div id="partial-skill-form-modal" data-partial="skill-form-modal" x-ignore></div>
  <div id="partial-build-image-modal" data-partial="build-image-modal" x-ignore></div>
<script src="/app.js"></script>

</body>
</html>
