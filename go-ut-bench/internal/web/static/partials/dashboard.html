      <!-- DASHBOARD -->
      <div x-show="page === 'dashboard'" class="cloud-page animate-fadeUp">
        <div class="cloud-page-head">
          <div class="cloud-page-head-main">
            <h2 class="page-title">总览</h2>
            <p class="page-subtitle">单元测试基准平台运行概览，聚合任务、模型、环境和数据资产状态。</p>
          </div>
          <div class="cloud-page-head-actions">
            <button @click="loadRuns()" class="btn-ghost">刷新</button>
            <button @click="goto('new-run')" class="btn-primary">新建任务</button>
          </div>
        </div>

        <div class="cloud-summary-grid">
          <div class="cloud-stat-card">
            <span>任务总量</span>
            <strong x-text="runs.length"></strong>
            <span>当前工作区已创建的评测任务</span>
          </div>
          <div class="cloud-stat-card">
            <span>运行中</span>
            <strong class="kpi-running" x-text="runCountByStatus('running')"></strong>
            <span>包含暂停中的执行任务</span>
          </div>
          <div class="cloud-stat-card">
            <span>已完成</span>
            <strong class="kpi-completed" x-text="runCountByStatus('completed')"></strong>
            <span>可查看报告或补录入库</span>
          </div>
          <div class="cloud-stat-card">
            <span>失败/取消</span>
            <strong class="kpi-failed" x-text="runCountByStatus('failed', 'canceled')"></strong>
            <span>建议优先进入详情查看日志</span>
          </div>
        </div>

        <div class="cloud-layout cloud-layout-wide">
          <section class="cloud-main cloud-card">
            <div class="cloud-card-head">
              <div>
                <div class="cloud-card-title">最近任务</div>
                <div class="cloud-card-sub">按启动时间展示最近 10 个运行资源，点击行进入详情。</div>
              </div>
              <button @click="goto('runs')" class="btn-link">查看全部</button>
            </div>
            <div x-show="runs.length === 0" class="cloud-empty m-4">
              暂无任务。<button @click="goto('new-run')" style="color:var(--accent)" class="ml-1">新建任务</button>
            </div>
            <div class="overflow-x-auto" x-show="runs.length > 0">
              <table class="data-table">
                <thead><tr><th>任务 ID</th><th>状态</th><th>被测对象</th><th>语言</th><th>启动时间</th><th style="width:80px"></th></tr></thead>
                <tbody>
                  <template x-for="run in runs.slice(0,10)" :key="run.run_id">
                    <tr @click="openRun(run.run_id)">
                      <td class="font-mono text-[12px]" style="color:var(--fg-muted)" x-text="run.run_id"></td>
                      <td>
                        <span :class="'status-' + run.status" class="inline-flex items-center text-[12px] font-medium px-2.5 py-0.5 rounded-full" style="background:var(--badge-bg)">
                          <span class="status-dot"></span><span x-text="statusText(run.status, run.paused)"></span>
                        </span>
                        <span x-show="run.paused" class="ml-1 text-[10px] px-1.5 py-0.5 rounded" style="background:var(--warn-bg);color:var(--yellow)">暂停</span>
                      </td>
                      <td style="color:var(--fg-muted)" x-text="runSubjectSummary(run)"></td>
                      <td style="color:var(--fg-muted)" x-text="(run.spec?.languages ?? []).join(', ') || '—'"></td>
                      <td style="color:var(--fg-muted)" x-text="fmtTime(run.started_at)"></td>
                      <td class="text-right"><span style="color:var(--accent)" class="text-[12px]">详情</span></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>

          <aside class="cloud-side">
            <section class="cloud-card">
              <div class="cloud-card-head">
                <div>
                  <div class="cloud-card-title">快速操作</div>
                  <div class="cloud-card-sub">常用控制台入口</div>
                </div>
              </div>
              <div class="cloud-card-body cloud-panel-stack">
                <button @click="goto('new-run')" class="btn-primary w-full justify-center">创建评测任务</button>
                <button @click="goto('models')" class="btn-ghost w-full justify-center">管理模型注册表</button>
                <button @click="goto('database')" class="btn-ghost w-full justify-center">进入资产工作台</button>
                <button @click="goto('environment')" class="btn-ghost w-full justify-center">检查运行环境</button>
              </div>
            </section>
            <section class="cloud-card">
              <div class="cloud-card-head">
                <div>
                  <div class="cloud-card-title">运行环境</div>
                  <div class="cloud-card-sub">Docker 与评测镜像状态</div>
                </div>
              </div>
              <div class="cloud-card-body">
                <div class="cloud-resource-list">
                  <div class="cloud-resource-item">
                    <div class="cloud-resource-title">
                      <strong>Docker</strong>
                      <span class="tag-pill" :style="env?.docker_available ? 'background:var(--success-bg);color:var(--green)' : 'background:var(--error-bg);color:var(--red)'" x-text="env?.docker_available ? '可用' : '不可用'"></span>
                    </div>
                    <div class="cloud-panel-note mt-2" x-text="env?.docker_version || '尚未检测版本'"></div>
                  </div>
                  <div class="cloud-resource-item">
                    <div class="cloud-resource-title">
                      <strong>评测镜像</strong>
                      <span class="tag-pill" :style="env?.eval_image_present ? 'background:var(--success-bg);color:var(--green)' : 'background:var(--warn-bg);color:var(--yellow)'" x-text="env?.eval_image_present ? '已就绪' : '未构建'"></span>
                    </div>
                    <div class="cloud-panel-note mt-2" x-text="env?.eval_image_name || 'utbench:latest'"></div>
                  </div>
                </div>
                <button x-show="env?.docker_available && !env?.eval_image_present" @click="openBuildImage('eval', false)" class="btn-primary mt-3">构建评测镜像</button>
              </div>
            </section>
          </aside>
        </div>
      </div>
