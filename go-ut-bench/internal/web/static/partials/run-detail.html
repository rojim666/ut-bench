      <!-- RUN DETAIL -->
      <div x-show="page === 'run-detail'" class="max-w-6xl space-y-4 animate-fadeUp">
        <template x-if="currentRun">
          <div>
            <!-- Detail Header -->
            <div class="form-section flex items-start gap-4">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-3 mb-2">
                  <span :class="'status-' + currentRun.status" class="inline-flex items-center text-[12px] font-medium px-2.5 py-1 rounded-full" style="background:var(--badge-bg)">
                    <span class="status-dot"></span><span x-text="statusText(currentRun.status, currentRun.paused)"></span>
                  </span>
                  <span x-show="currentRun.paused" class="text-[10px] px-1.5 py-0.5 rounded" style="background:var(--warn-bg);color:var(--yellow)">暂停</span>
                  <span x-show="currentRun.label" class="font-semibold text-[14px]" style="color:var(--fg)" x-text="currentRun.label"></span>
                  <span x-show="currentRun.label" class="text-[11px]" style="color:var(--fg-muted)">·</span>
                  <span class="font-mono text-[13px]" style="color:var(--fg-muted)" x-text="currentRun.run_id"></span>
                </div>
                <div class="flex flex-wrap gap-x-6 gap-y-1 text-[12px]" style="color:var(--fg-muted)">
                  <span>被测对象: <span style="color:var(--fg)" x-text="runSubjectSummary(currentRun)"></span></span>
                  <span>模型: <span style="color:var(--fg)" x-text="(currentRun.spec?.models ?? []).join(', ') || '—'"></span></span>
                  <span>语言: <span style="color:var(--fg)" x-text="(currentRun.spec?.languages ?? []).join(', ')"></span></span>
                  <span>类型: <span style="color:var(--fg)" x-text="(currentRun.spec?.dataset_classes ?? []).join(', ') || '—'"></span></span>
                  <span>场景: <span style="color:var(--fg)" x-text="currentRun.spec?.dataset_scenario || '—'"></span></span>
                  <span>样本: <span style="color:var(--fg)" x-text="currentRun.spec?.max_samples ?? '—'"></span></span>
                  <span>并发: <span style="color:var(--fg)" x-text="currentRun.spec?.workers ?? 0"></span></span>
                  <span>复用生成: <span style="color:var(--fg)" x-text="currentRun.spec?.reuse_generated ? '开启' : '关闭'"></span></span>
                  <span>复用评测: <span style="color:var(--fg)" x-text="currentRun.spec?.reuse_evaluation ? '开启' : '关闭'"></span></span>
                  <span>后端: <span style="color:var(--fg)" x-text="currentRun.use_docker ? 'Docker' : '本地进程'"></span></span>
                  <span x-show="currentReport?.runtime_summary?.sandbox_providers?.length">沙箱: <span style="color:var(--fg)" x-text="(currentReport?.runtime_summary?.sandbox_providers ?? []).join(', ')"></span></span>
                  <span x-show="currentReport?.runtime_summary?.agent_frameworks?.length">Agent: <span style="color:var(--fg)" x-text="(currentReport?.runtime_summary?.agent_frameworks ?? []).join(', ')"></span></span>
                  <span x-show="currentReport?.runtime_summary?.evaluator_env_fingerprint">评测指纹: <code class="font-mono text-[11px]" style="color:var(--fg-muted)" x-text="(currentReport?.runtime_summary?.evaluator_env_fingerprint || '').slice(0, 12) + '...'"></code></span>
                  <span>启动: <span style="color:var(--fg)" x-text="fmtTime(currentRun.started_at)"></span></span>
                  <span x-show="currentRun.ended_at">耗时: <span style="color:var(--fg)" x-text="duration(currentRun.started_at, currentRun.ended_at)"></span></span>
                </div>
                <div x-show="currentRun.error" class="mt-2 text-[12px] rounded-lg p-2.5" style="background:var(--error-bg);color:var(--red);border:1px solid var(--error-border)" x-text="currentRun.error"></div>
              </div>
              <div class="flex gap-2 flex-shrink-0 flex-wrap justify-end">
                <template x-if="currentRun.status === 'running'">
                  <span class="inline-flex gap-1.5">
                    <button x-show="!currentRun.paused" @click="runControl(currentRun.run_id, 'pause')" class="btn-ghost" title="暂停">暂停</button>
                    <button x-show="currentRun.paused" @click="runControl(currentRun.run_id, 'resume')" class="btn-ghost" title="继续">继续</button>
                    <button @click="runControl(currentRun.run_id, 'cancel')" class="btn-ghost" style="color:var(--red)" title="取消">取消</button>
                    <button @click="refreshDetail()" class="btn-ghost">刷新</button>
                  </span>
                </template>
                <button x-show="currentRun.status === 'completed' || currentRun.status === 'failed' || currentRun.status === 'canceled'" @click="reevaluateRun(currentRun.run_id)" :disabled="runActionBusy === 'reevaluate'" class="btn-ghost" style="color:var(--accent)" title="重新运行 evaluator：重新编译、运行测试、覆盖率和变异测试">
                  <span x-text="runActionBusy === 'reevaluate' ? '评测中...' : '重新评测'"></span>
                </button>
                <button x-show="currentRun.status === 'completed' || currentRun.status === 'failed' || currentRun.status === 'canceled'" @click="regenerateReport(currentRun.run_id)" :disabled="runActionBusy === 'report'" class="btn-ghost" style="color:var(--green)" title="根据 evaluation_result.json 重新生成报告">
                  <span x-text="runActionBusy === 'report' ? '生成中...' : '从 JSON 生成报告'"></span>
                </button>
                <button x-show="currentRun.status === 'completed' || currentRun.status === 'failed' || currentRun.status === 'canceled'" @click="ingestRunToDB(currentRun.run_id)" :disabled="dbIngesting" class="btn-ghost" style="color:var(--green)" title="补录该任务到数据库">
                  <span x-text="dbIngesting ? '入库中...' : '入库'"></span>
                </button>
                <button x-show="currentRun.status === 'completed' || currentRun.status === 'failed' || currentRun.status === 'canceled'" @click="rerunRun(currentRun.run_id)" class="btn-ghost" style="color:var(--yellow)" title="以相同配置再跑一次">重跑</button>
                <button @click="renameRun(currentRun.run_id, currentRun.label)" class="btn-ghost" style="color:var(--fg-muted)" title="设置备注名">备注</button>
                <button x-show="currentRun.status !== 'running' && currentRun.status !== 'pending'" @click="deleteRun(currentRun.run_id)" class="btn-ghost" style="color:var(--red)" title="删除该任务及所有产物">删除</button>
                <button @click="goto('runs')" class="btn-ghost">返回</button>
                <button x-show="currentRun.status === 'completed'" @click="openHtmlReport()" class="btn-warm text-[12px]">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
                  打开 HTML 报告
                </button>
              </div>
            </div>

            <!-- Tabs -->
            <div class="flex gap-0 border-b mb-4" style="border-color:var(--border)">
              <button @click="detailTab = 'logs'" :class="detailTab === 'logs' ? 'active' : ''" class="tab-btn">日志</button>
              <button @click="detailTab = 'report'; loadReport()" :class="detailTab === 'report' ? 'active' : ''" class="tab-btn">报告</button>
              <button @click="detailTab = 'analysis'; loadAnalysis(false)" :class="detailTab === 'analysis' ? 'active' : ''" class="tab-btn">AI 分析</button>
            </div>

            <!-- Logs -->
            <div x-show="detailTab === 'logs'" class="form-section p-0 overflow-hidden">
              <div class="px-4 py-2.5 border-b flex items-center justify-between" style="border-color:var(--border);background:var(--bg-elevated)">
                <span class="text-[12px]" style="color:var(--fg-muted)">实时输出 · <span x-text="_logCount"></span> 行</span>
                <button @click="scrollLogsBottom()" class="text-[12px]" style="color:var(--fg-subtle)">滚动到底部</button>
              </div>
              <div id="log-area" class="terminal text-[12px] p-4 h-[540px] overflow-y-auto leading-5" style="background:#020408;color:var(--green)">
                <pre id="log-pre" class="log-pre whitespace-pre-wrap break-words m-0" style="font:inherit;color:inherit"></pre>
                <div x-show="currentRun.status === 'running'" class="animate-pulse mt-1" style="color:var(--yellow)">▊</div>
                <div id="log-bottom"></div>
              </div>
            </div>

            <!-- Report -->
            <div x-show="detailTab === 'report'">
              <div x-show="!currentReport && currentRun.status !== 'completed'" class="form-section py-12 text-center">
                <div x-show="currentRun.status === 'running'" class="animate-pulse text-[13px]" style="color:var(--fg-muted)">评测进行中...</div>
                <div x-show="currentRun.status === 'failed'" style="color:var(--red)" class="text-[13px]">任务失败，无报告可用。</div>
                <div x-show="currentRun.status === 'pending'" class="text-[13px]" style="color:var(--yellow)">等待开始...</div>
              </div>
              <div x-show="!currentReport && currentRun.status === 'completed'" class="form-section py-12 text-center">
                <button @click="loadReport()" style="color:var(--accent)" class="text-[13px] hover:underline">加载报告</button>
              </div>

              <template x-if="currentReport">
                <div class="space-y-4">
                  <!-- Summary -->
                  <div class="grid grid-cols-5 gap-3">
                    <template x-for="card in reportCards" :key="card.label">
                      <div class="kpi-card text-center">
                        <div class="kpi-value" :class="card.color" x-text="card.value"></div>
                        <div class="kpi-label" x-text="card.label"></div>
                      </div>
                    </template>
                  </div>

                  <div class="form-section" x-show="currentReport.runtime_summary">
                    <div class="section-title flex items-center justify-between">
                      <span>运行时拓扑</span>
                      <span class="text-[11px] font-normal" style="color:var(--fg-subtle)">执行面 / 沙箱面 / 镜像</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-[12px]">
                      <div class="space-y-2">
                        <div>评测环境指纹: <code class="font-mono text-[11px]" x-text="currentReport.runtime_summary?.evaluator_env_fingerprint || '—'"></code></div>
                        <div>Agent 框架: <span x-text="(currentReport.runtime_summary?.agent_frameworks || []).join(', ') || '—'"></span></div>
                        <div>沙箱 Provider: <span x-text="(currentReport.runtime_summary?.sandbox_providers || []).join(', ') || '—'"></span></div>
                      </div>
                      <div class="space-y-2">
                        <div>沙箱镜像: <span x-text="(currentReport.runtime_summary?.sandbox_images || []).join(', ') || '—'"></span></div>
                        <div>Docker 沙箱样本: <span x-text="currentReport.runtime_summary?.docker_backed_subjects ?? 0"></span></div>
                        <div>本地沙箱样本: <span x-text="currentReport.runtime_summary?.local_backed_subjects ?? 0"></span></div>
                      </div>
                    </div>
                    <div x-show="(currentReport.runtime_summary?.notes || []).length" class="mt-3 text-[12px]" style="color:var(--fg-muted)">
                      <template x-for="(note, idx) in (currentReport.runtime_summary?.notes || [])" :key="idx">
                        <div class="py-1" x-text="'· ' + note"></div>
                      </template>
                    </div>
                  </div>

                  <!-- Charts: radar + bar -->
                  <div class="grid grid-cols-2 gap-4">
                    <div class="form-section">
                      <div class="section-title flex items-center justify-between">
                        <span>能力雷达</span>
                        <span class="text-[11px] font-normal" style="color:var(--fg-subtle)">编译 / 测试 / 覆盖 / 变异 / 效率</span>
                      </div>
                      <div class="h-64"><canvas id="radarChart"></canvas></div>
                    </div>
                    <div class="form-section">
                      <div class="section-title">模型对比</div>
                      <div class="h-64"><canvas id="modelChart"></canvas></div>
                    </div>
                  </div>

                  <!-- Scenario heatmap: model × (language·scenario) with mutation score -->
                  <div class="form-section" x-show="heatmap.cols.length > 0">
                    <div class="section-title flex items-center justify-between">
                      <span>变异分热力图</span>
                      <span class="text-[11px] font-normal" style="color:var(--fg-subtle)">颜色越暖表示变异分越高（测试越能发现 bug）</span>
                    </div>
                    <div class="overflow-x-auto">
                      <table class="text-[12px] w-full" style="border-collapse:separate;border-spacing:2px">
                        <thead>
                          <tr>
                            <th class="text-left p-2 font-medium" style="color:var(--fg-muted)">模型 \\ 场景</th>
                            <template x-for="col in heatmap.cols" :key="col">
                              <th class="p-2 font-mono text-[11px] text-center whitespace-nowrap" style="color:var(--fg-muted)" x-text="col"></th>
                            </template>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="row in heatmap.rows" :key="row.model">
                            <tr>
                              <td class="p-2 font-medium whitespace-nowrap" x-text="row.model"></td>
                              <template x-for="(v,i) in row.values" :key="i">
                                <td class="p-2 text-center font-mono rounded"
                                    :style="heatCell(v)"
                                    :title="heatmap.cols[i] + ': ' + (v==null ? '无数据' : (v*100).toFixed(1)+'%')">
                                  <span x-text="v==null ? '—' : (v*100).toFixed(0)"></span>
                                </td>
                              </template>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <!-- Leaderboard -->
                  <div class="form-section p-0 overflow-hidden">
                    <div class="px-4 py-3 border-b text-[13px] font-medium" style="border-color:var(--border)">排行榜</div>
                    <table class="data-table">
                      <thead>
                        <tr>
                          <th style="width:50px">排名</th><th>模型</th>
                          <th class="text-right">编译</th><th class="text-right">样测</th>
                          <th class="text-right">覆盖率</th><th class="text-right">变异</th>
                          <th class="text-right" title="每通过样本所需的平均生成 token 数，越小越高效">tokens/通过</th>
                          <th class="text-right" title="每通过样本所需的平均耗时，越小越快">ms/通过</th>
                          <th class="text-right">总分</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="m in currentReport.top_models ?? []" :key="m.rank">
                          <tr>
                            <td class="font-mono text-[12px]" style="color:var(--fg-muted)">#<span x-text="m.rank"></span></td>
                            <td class="font-medium text-[13px]" x-text="m.model"></td>
                            <td class="text-right text-[12px]" :class="pctColor(m.compile_pass_rate)" x-text="pct(m.compile_pass_rate)"></td>
                            <td class="text-right text-[12px]" :class="pctColor(m.avg_test_pass_rate)" x-text="pct(m.avg_test_pass_rate)"></td>
                            <td class="text-right text-[12px]" :class="pctColor(m.avg_line_coverage)" x-text="pct(m.avg_line_coverage)"></td>
                            <td class="text-right text-[12px]" :class="pctColor(m.avg_mutation_score)" x-text="pct(m.avg_mutation_score)"></td>
                            <td class="text-right text-[12px] font-mono" style="color:var(--fg-muted)" x-text="fmtInt(m.tokens_per_pass)"></td>
                            <td class="text-right text-[12px] font-mono" style="color:var(--fg-muted)" x-text="fmtMs(m.ms_per_pass)"></td>
                            <td class="text-right text-[13px] font-bold" style="color:var(--accent)" x-text="((m.composite_score||0)*100).toFixed(1)"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>

                  <!-- Failures -->
                  <div x-show="(currentReport.failures ?? []).length > 0" class="form-section p-0 overflow-hidden">
                    <div class="px-4 py-3 border-b text-[13px] font-medium" style="border-color:var(--border)">失败项</div>
                    <table class="data-table">
                      <thead><tr><th>阶段</th><th>错误类型</th><th class="text-right">总数</th><th>按模型分布</th><th>示例</th></tr></thead>
                      <tbody>
                        <template x-for="f in currentReport.failures ?? []" :key="f.error_type+f.stage">
                          <tr>
                            <td style="color:var(--fg-muted)" class="text-[12px]" x-text="f.stage"></td>
                            <td style="color:var(--red)" class="font-mono text-[12px]" x-text="f.error_type"></td>
                            <td class="text-right text-[12px] font-medium" x-text="f.count"></td>
                            <td class="text-[12px]">
                              <div class="flex flex-wrap gap-1.5">
                                <template x-for="m in Object.entries(f.by_model || {}).sort((a,b)=>b[1]-a[1])" :key="m[0]">
                                  <span class="tag-pill" style="background:rgba(239,68,68,.08);color:var(--red);font-size:11px">
                                    <span class="font-medium" x-text="m[0]"></span>
                                    <span class="opacity-70" x-text="'×'+m[1]"></span>
                                  </span>
                                </template>
                                <span x-show="!f.by_model || Object.keys(f.by_model).length===0" style="color:var(--fg-subtle)">—</span>
                              </div>
                            </td>
                            <td class="text-[12px] truncate max-w-xs" style="color:var(--fg-muted)" x-text="f.example_message || '—'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>

                  <!-- Score Exclusions -->
                  <div class="form-section p-0 overflow-hidden">
                    <div class="px-4 py-3 border-b flex items-center justify-between" style="border-color:var(--border)">
                      <div class="text-[13px] font-medium">计分剔除</div>
                      <div class="text-[11px]" style="color:var(--fg-subtle)">
                        <span x-text="currentReport.summary?.excluded_samples ?? 0"></span>
                        <span> / </span>
                        <span x-text="currentReport.summary?.total_samples ?? 0"></span>
                      </div>
                    </div>
                    <div x-show="!(currentReport.score_exclusions ?? []).length" class="p-4 text-[12px]" style="color:var(--fg-muted)">
                      当前报告没有计分剔除项。只有 environment / dataset / tool 归因的样本会被剔除；模型自身生成导致的失败仍进入计分。
                    </div>
                    <table x-show="(currentReport.score_exclusions ?? []).length" class="data-table">
                      <thead><tr><th>归因</th><th>原因</th><th class="text-right">数量</th><th>示例模型</th><th>示例样本</th></tr></thead>
                      <tbody>
                        <template x-for="item in currentReport.score_exclusions ?? []" :key="item.origin + item.reason">
                          <tr>
                            <td><span class="tag-pill" style="background:var(--warn-bg);color:var(--yellow)" x-text="item.origin"></span></td>
                            <td class="text-[12px]" style="color:var(--fg-muted)" x-text="item.reason"></td>
                            <td class="text-right text-[12px] font-medium" x-text="item.count"></td>
                            <td class="text-[12px]" x-text="item.example_model || '-'"></td>
                            <td class="font-mono text-[12px]" style="color:var(--fg-muted)" x-text="item.example_sample || '-'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>
            </div>

            <!-- AI Analysis -->
            <div x-show="detailTab === 'analysis'" class="space-y-4">
              <div class="form-section">
                <div class="flex flex-wrap items-end gap-3">
                  <label class="inline-flex items-center gap-2 text-[12px]" style="color:var(--fg-muted)">
                    <input type="checkbox" x-model="analysisOptions.llm_enabled">
                    <span>启用 LLM 诊断</span>
                  </label>
                  <label class="text-[12px]" style="color:var(--fg-muted)">
                    <div class="mb-1">诊断模型</div>
                    <select x-model="analysisOptions.llm_model" class="input-field min-w-[220px]">
                      <option value="">自动选择</option>
                      <template x-for="m in analysisModels()" :key="m">
                        <option :value="m" x-text="m"></option>
                      </template>
                    </select>
                  </label>
                  <button @click="generateAnalysis(true)" :disabled="analysisGenerating" class="btn-primary">
                    <span x-text="analysisGenerating ? '分析中...' : (currentAnalysis ? '重新分析' : '生成分析')"></span>
                  </button>
                  <button @click="loadAnalysis(true)" :disabled="analysisLoading" class="btn-ghost">刷新</button>
                  <span class="text-[12px]" style="color:var(--fg-muted)" x-show="currentAnalysis">
                    LLM: <span x-text="currentAnalysis?.llm_status?.status || 'unknown'"></span>
                  </span>
                </div>
              </div>

              <div x-show="analysisLoading && !currentAnalysis" class="form-section py-10 text-center text-[13px]" style="color:var(--fg-muted)">正在读取分析结果...</div>
              <div x-show="!analysisLoading && !currentAnalysis" class="form-section py-10 text-center">
                <div class="text-[13px] mb-3" style="color:var(--fg-muted)">当前 run 还没有 AI 分析结果。</div>
                <button @click="generateAnalysis(true)" :disabled="analysisGenerating" class="btn-primary" x-text="analysisGenerating ? '分析中...' : '立即生成分析'"></button>
              </div>

              <template x-if="currentAnalysis">
                <div class="space-y-4">
                  <div class="grid grid-cols-5 gap-3">
                    <div class="kpi-card text-center">
                      <div class="kpi-value kpi-total" x-text="currentAnalysis.summary?.result_count ?? 0"></div>
                      <div class="kpi-label">结果数</div>
                    </div>
                    <div class="kpi-card text-center">
                      <div class="kpi-value pct-bad" x-text="currentAnalysis.summary?.critical_count ?? 0"></div>
                      <div class="kpi-label">P0</div>
                    </div>
                    <div class="kpi-card text-center">
                      <div class="kpi-value pct-warn" x-text="currentAnalysis.summary?.warning_count ?? 0"></div>
                      <div class="kpi-label">P1/P2</div>
                    </div>
                    <div class="kpi-card text-center">
                      <div class="kpi-value pct-good" x-text="(currentAnalysis.trace_quality?.subjects_with_trajectory ?? 0) + '/' + (currentAnalysis.trace_quality?.total_subjects ?? 0)"></div>
                      <div class="kpi-label">Trajectory</div>
                    </div>
                    <div class="kpi-card text-center">
                      <div class="kpi-value" style="color:var(--accent)" x-text="currentAnalysis.summary?.recommendation_count ?? 0"></div>
                      <div class="kpi-label">建议</div>
                    </div>
                  </div>

                  <div class="form-section">
                    <div class="section-title">LLM 状态</div>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-[12px]" style="color:var(--fg-muted)">
                      <div><div class="mb-1">状态</div><span class="tag-pill" x-text="currentAnalysis.llm_status?.status || 'disabled'"></span></div>
                      <div><div class="mb-1">模型</div><span class="font-mono" x-text="currentAnalysis.llm_status?.model || '自动/未启用'"></span></div>
                      <div><div class="mb-1">证据条数</div><span class="font-mono" x-text="currentAnalysis.llm_status?.evidence_count ?? 0"></span></div>
                      <div><div class="mb-1">证据样本</div><span class="font-mono" x-text="currentAnalysis.llm_status?.evidence_subject_count ?? 0"></span></div>
                      <div><div class="mb-1">降级原因</div><span x-text="currentAnalysis.llm_status?.message || '无'"></span></div>
                    </div>
                  </div>

                  <div class="form-section">
                    <div class="section-title">总体结论</div>
                    <div class="text-[13px]" style="color:var(--fg)" x-text="currentAnalysis.summary?.headline"></div>
                    <div x-show="currentAnalysis.llm?.summary" class="mt-2 text-[12px]" style="color:var(--fg-muted)" x-text="currentAnalysis.llm?.summary"></div>
                    <div class="mt-3 flex flex-wrap gap-2">
                      <template x-for="(p, idx) in currentAnalysis.summary?.key_points || []" :key="idx">
                        <span class="tag-pill" x-text="p"></span>
                      </template>
                    </div>
                  </div>

                  <div class="form-section p-0 overflow-hidden">
                    <div class="px-4 py-3 border-b flex flex-wrap items-center gap-3" style="border-color:var(--border)">
                      <span class="text-[13px] font-medium">问题诊断</span>
                      <select x-model="analysisFilters.source" class="input-field text-[12px] w-[120px]"><option value="">全部来源</option><template x-for="v in analysisFilterValues('source')" :key="v"><option :value="v" x-text="v"></option></template></select>
                      <select x-model="analysisFilters.severity" class="input-field text-[12px] w-[120px]"><option value="">全部级别</option><template x-for="v in analysisFilterValues('severity')" :key="v"><option :value="v" x-text="v"></option></template></select>
                      <select x-model="analysisFilters.category" class="input-field text-[12px] w-[140px]"><option value="">全部分类</option><template x-for="v in analysisFilterValues('category')" :key="v"><option :value="v" x-text="v"></option></template></select>
                      <select x-model="analysisFilters.subject" class="input-field text-[12px] min-w-[220px]"><option value="">全部 subject</option><template x-for="v in analysisFilterValues('subject')" :key="v"><option :value="v" x-text="v"></option></template></select>
                    </div>
                    <div x-show="!analysisFindings().length" class="p-4 text-[12px]" style="color:var(--fg-muted)">暂无匹配的诊断问题。</div>
                    <div class="divide-y" style="border-color:var(--border)">
                      <template x-for="f in analysisFindings()" :key="f.id">
                        <details class="p-4">
                          <summary class="cursor-pointer flex items-center gap-2">
                            <span class="tag-pill border" :style="findingBadgeStyle(f.severity)" x-text="f.severity"></span>
                            <span class="tag-pill border" :style="analysisSourceBadgeStyle(f.source)" x-text="analysisSourceLabel(f.source)"></span>
                            <span class="tag-pill" x-text="f.category"></span>
                            <span class="font-medium text-[13px]" x-text="f.title"></span>
                            <span class="ml-auto font-mono text-[11px]" style="color:var(--fg-muted)" x-text="f.subject_id || 'global'"></span>
                          </summary>
                          <div class="mt-3 text-[12px] space-y-2" style="color:var(--fg-muted)">
                            <div x-text="f.detail"></div>
                            <div x-show="f.recommendation"><span style="color:var(--fg)">建议：</span><span x-text="f.recommendation"></span></div>
                            <div x-show="f.confidence" class="font-mono text-[11px]">confidence=<span x-text="f.confidence"></span></div>
                            <template x-for="(e, idx) in f.evidence || []" :key="analysisEvidenceKey(e, idx)">
                              <details class="rounded p-2" style="background:var(--bg-muted);color:var(--fg-subtle)">
                                <summary class="cursor-pointer font-mono text-[11px]" x-text="analysisEvidenceLabel(e)"></summary>
                                <div class="mt-2 font-mono text-[11px] whitespace-pre-wrap break-words" x-text="e.excerpt || e.path || ''"></div>
                              </details>
                            </template>
                          </div>
                        </details>
                      </template>
                    </div>
                  </div>

                  <div class="form-section p-0 overflow-hidden">
                    <div class="px-4 py-3 border-b text-[13px] font-medium" style="border-color:var(--border)">Agent 对比</div>
                    <table class="data-table">
                      <thead><tr><th>Subject</th><th>样本</th><th>Trace</th><th>读源码</th><th>写测试</th><th>运行测试</th><th>策略命令</th><th>噪声</th></tr></thead>
                      <tbody>
                        <template x-for="s in currentAnalysis.subjects || []" :key="s.subject_id + s.sample_id">
                          <tr>
                            <td class="font-mono text-[12px]" x-text="s.subject_id"></td>
                            <td class="font-mono text-[12px]" x-text="s.sample_id"></td>
                            <td class="text-[12px]" x-text="s.trace_step_count"></td>
                            <td class="text-[12px]" x-text="s.has_source_read ? '是' : '否'"></td>
                            <td class="text-[12px]" x-text="s.has_test_write ? '是' : '否'"></td>
                            <td class="text-[12px]" x-text="s.has_test_execution ? '是' : '否'"></td>
                            <td class="text-[12px]" x-text="s.policy_command_count"></td>
                            <td class="text-[12px]" x-text="s.runtime_noise_count"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>

                  <div class="form-section">
                    <div class="section-title">Step-by-step Trajectory</div>
                    <template x-for="s in currentAnalysis.subjects || []" :key="s.subject_id + '-trajectory-' + s.sample_id">
                      <details class="mb-3 rounded border" style="border-color:var(--border)">
                        <summary class="cursor-pointer px-3 py-2 text-[13px] font-medium" x-text="s.subject_id + ' / ' + s.sample_id + ' · ' + s.trace_step_count + ' steps'"></summary>
                        <div class="max-h-[520px] overflow-y-auto divide-y" style="border-color:var(--border)">
                          <template x-for="step in s.trajectory || []" :key="step.index">
                            <div class="p-3 text-[12px] grid grid-cols-[70px_120px_1fr] gap-3">
                              <div class="font-mono" style="color:var(--fg-muted)">#<span x-text="step.index"></span></div>
                              <div>
                                <div class="font-medium" x-text="step.kind"></div>
                                <div class="font-mono text-[11px]" style="color:var(--fg-subtle)" x-text="step.tool || step.role || ''"></div>
                              </div>
                              <div class="space-y-1 min-w-0">
                                <div x-show="step.text_excerpt" x-text="step.text_excerpt"></div>
                                <div x-show="step.input_excerpt" class="font-mono text-[11px] whitespace-pre-wrap break-words" style="color:var(--fg-muted)" x-text="step.input_excerpt"></div>
                                <div x-show="step.output_excerpt" class="font-mono text-[11px] whitespace-pre-wrap break-words" style="color:var(--fg-subtle)" x-text="step.output_excerpt"></div>
                              </div>
                            </div>
                          </template>
                        </div>
                      </details>
                    </template>
                  </div>

                  <div class="form-section">
                    <div class="section-title">优化建议</div>
                    <div class="space-y-2">
                      <template x-for="r in analysisRecommendations()" :key="r.id">
                        <details class="rounded border p-3" style="border-color:var(--border)">
                          <summary class="cursor-pointer flex items-center gap-2">
                            <span class="tag-pill" x-text="r.priority"></span>
                            <span class="tag-pill border" :style="analysisSourceBadgeStyle(r.source)" x-text="analysisSourceLabel(r.source)"></span>
                            <span class="tag-pill" x-text="r.target || r.category"></span>
                            <span class="font-medium text-[13px]" x-text="r.title"></span>
                          </summary>
                          <div class="mt-2 text-[12px] space-y-2" style="color:var(--fg-muted)">
                            <div x-text="r.detail"></div>
                            <div x-show="r.expected_impact"><span style="color:var(--fg)">预期影响：</span><span x-text="r.expected_impact"></span></div>
                            <div x-show="r.risk"><span style="color:var(--fg)">风险：</span><span x-text="r.risk"></span></div>
                            <template x-for="(e, idx) in r.evidence || []" :key="analysisEvidenceKey(e, idx)">
                              <details class="rounded p-2" style="background:var(--bg-muted);color:var(--fg-subtle)">
                                <summary class="cursor-pointer font-mono text-[11px]" x-text="analysisEvidenceLabel(e)"></summary>
                                <div class="mt-2 font-mono text-[11px] whitespace-pre-wrap break-words" x-text="e.excerpt || e.path || ''"></div>
                              </details>
                            </template>
                          </div>
                        </details>
                      </template>
                    </div>
                  </div>

                  <div class="form-section">
                    <div class="flex flex-wrap items-center gap-3 mb-4">
                      <div class="section-title mb-0">可执行优化方案</div>
                      <button @click="generateOptimizationPlan(true)" :disabled="optimizationGenerating || !currentAnalysis" class="btn-primary">
                        <span x-text="optimizationGenerating ? '生成中...' : (currentOptimizationPlan ? '重新生成方案' : '生成优化方案')"></span>
                      </button>
                      <button @click="loadOptimizationPlan(true)" :disabled="optimizationLoading" class="btn-ghost">刷新方案</button>
                      <span class="text-[12px]" style="color:var(--fg-muted)" x-show="currentOptimizationPlan">
                        LLM: <span x-text="currentOptimizationPlan?.llm_status?.status || 'unknown'"></span>
                        <span x-show="currentOptimizationPlan?.llm_status?.model"> · </span>
                        <span x-show="currentOptimizationPlan?.llm_status?.model" x-text="currentOptimizationPlan?.llm_status?.model"></span>
                      </span>
                    </div>

                    <div x-show="optimizationLoading && !currentOptimizationPlan" class="py-6 text-center text-[13px]" style="color:var(--fg-muted)">正在读取优化方案...</div>
                    <div x-show="!optimizationLoading && !currentOptimizationPlan" class="rounded border p-4 text-[13px]" style="border-color:var(--border);color:var(--fg-muted)">
                      当前 run 还没有优化方案。先确认 AI 分析已生成，再点击“生成优化方案”。
                    </div>

                    <template x-if="currentOptimizationPlan">
                      <div class="space-y-4">
                        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                          <div class="kpi-card text-center">
                            <div class="kpi-value kpi-total" x-text="currentOptimizationPlan.summary?.item_count ?? 0"></div>
                            <div class="kpi-label">方案项</div>
                          </div>
                          <div class="kpi-card text-center">
                            <div class="kpi-value pct-bad" x-text="currentOptimizationPlan.summary?.high_priority_count ?? 0"></div>
                            <div class="kpi-label">高优先级</div>
                          </div>
                          <div class="kpi-card text-center">
                            <div class="kpi-value" style="color:var(--accent)" x-text="currentOptimizationPlan.summary?.llm_item_count ?? 0"></div>
                            <div class="kpi-label">LLM 项</div>
                          </div>
                          <div class="kpi-card text-center">
                            <div class="kpi-value pct-warn" x-text="currentOptimizationPlan.summary?.rule_item_count ?? 0"></div>
                            <div class="kpi-label">规则项</div>
                          </div>
                          <div class="kpi-card text-center">
                            <div class="kpi-value pct-good" x-text="optimizationTargets().length"></div>
                            <div class="kpi-label">目标类型</div>
                          </div>
                        </div>

                        <div class="rounded border p-3 text-[12px]" style="border-color:var(--border);color:var(--fg-muted)">
                          <div class="text-[13px] mb-2" style="color:var(--fg)" x-text="currentOptimizationPlan.summary?.headline"></div>
                          <div class="flex flex-wrap gap-2">
                            <template x-for="(p, idx) in currentOptimizationPlan.summary?.key_points || []" :key="'opt-point-' + idx">
                              <span class="tag-pill" x-text="p"></span>
                            </template>
                          </div>
                          <div x-show="currentOptimizationPlan.llm_status?.message" class="mt-2">
                            降级原因：<span x-text="currentOptimizationPlan.llm_status?.message"></span>
                          </div>
                        </div>

                        <template x-for="target in optimizationTargets()" :key="'opt-target-' + target">
                          <div class="rounded border overflow-hidden" style="border-color:var(--border)">
                            <div class="px-4 py-3 border-b flex items-center gap-2" style="border-color:var(--border);background:var(--bg-elevated)">
                              <span class="text-[13px] font-medium" x-text="optimizationTargetLabel(target)"></span>
                              <span class="tag-pill" x-text="optimizationItems(target).length + ' 项'"></span>
                            </div>
                            <div class="divide-y" style="border-color:var(--border)">
                              <template x-for="item in optimizationItems(target)" :key="item.id">
                                <details class="p-4">
                                  <summary class="cursor-pointer flex flex-wrap items-center gap-2">
                                    <span class="tag-pill border" :style="findingBadgeStyle(item.priority)" x-text="item.priority"></span>
                                    <span class="tag-pill border" :style="analysisSourceBadgeStyle(item.source)" x-text="analysisSourceLabel(item.source)"></span>
                                    <span class="tag-pill" x-text="item.category"></span>
                                    <span class="font-medium text-[13px]" x-text="item.title"></span>
                                    <span class="ml-auto text-[11px] font-mono" style="color:var(--fg-muted)" x-text="(item.applies_to || []).join(', ')"></span>
                                  </summary>
                                  <div class="mt-3 text-[12px] space-y-3" style="color:var(--fg-muted)">
                                    <div x-text="item.detail"></div>
                                    <div x-show="(item.expected_metrics || []).length">
                                      <span style="color:var(--fg)">预期改善指标：</span>
                                      <template x-for="m in item.expected_metrics || []" :key="item.id + '-metric-' + m">
                                        <span class="tag-pill mr-1" x-text="m"></span>
                                      </template>
                                    </div>
                                    <div>
                                      <div class="font-medium mb-1" style="color:var(--fg)">修改清单</div>
                                      <div class="space-y-2">
                                        <template x-for="(a, idx) in item.actions || []" :key="item.id + '-action-' + idx">
                                          <div class="rounded p-2" style="background:var(--bg-muted)">
                                            <div class="font-medium" style="color:var(--fg)" x-text="a.title"></div>
                                            <div x-text="a.detail"></div>
                                            <div x-show="a.file_hint" class="font-mono text-[11px] mt-1" x-text="a.file_hint"></div>
                                          </div>
                                        </template>
                                      </div>
                                    </div>
                                    <div x-show="(item.verification || []).length">
                                      <div class="font-medium mb-1" style="color:var(--fg)">验收方式</div>
                                      <template x-for="(v, idx) in item.verification || []" :key="item.id + '-verify-' + idx">
                                        <div class="rounded p-2 mb-2" style="background:var(--bg-muted)">
                                          <div x-show="v.manual_step" x-text="v.manual_step"></div>
                                          <div x-show="v.command" class="font-mono text-[11px] whitespace-pre-wrap break-words" x-text="v.command"></div>
                                          <div>期望：<span x-text="v.expected"></span></div>
                                        </div>
                                      </template>
                                    </div>
                                    <div x-show="(item.risks || []).length">
                                      <div class="font-medium mb-1" style="color:var(--fg)">风险与回退</div>
                                      <template x-for="(risk, idx) in item.risks || []" :key="item.id + '-risk-' + idx">
                                        <div class="rounded p-2 mb-2" style="background:var(--warn-bg);color:var(--fg-muted)">
                                          <div x-text="risk.description"></div>
                                          <div x-show="risk.mitigation">缓解：<span x-text="risk.mitigation"></span></div>
                                          <div x-show="risk.rollback">回退：<span x-text="risk.rollback"></span></div>
                                        </div>
                                      </template>
                                    </div>
                                    <div x-show="(item.evidence || []).length">
                                      <div class="font-medium mb-1" style="color:var(--fg)">Evidence</div>
                                      <template x-for="(e, idx) in item.evidence || []" :key="optimizationEvidenceKey(e, idx)">
                                        <details class="rounded p-2 mb-2" style="background:var(--bg-muted);color:var(--fg-subtle)">
                                          <summary class="cursor-pointer font-mono text-[11px]" x-text="optimizationEvidenceLabel(e)"></summary>
                                          <div class="mt-2 font-mono text-[11px] whitespace-pre-wrap break-words" x-text="e.excerpt || e.path || ''"></div>
                                        </details>
                                      </template>
                                    </div>
                                  </div>
                                </details>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
